name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            libopenmpi-dev \
            ninja-build

      - name: Restore scientific dependencies
        id: scientific-dependencies
        uses: actions/cache@v5
        with:
          path: |
            .dependencies/downloads
            .dependencies/install
          key: scientific-dependencies-${{ runner.os }}-${{ runner.arch }}-Debug-${{ matrix.name }}-${{ hashFiles('scripts/install_dependencies.sh') }}

      - name: Build scientific dependencies
        if: steps.scientific-dependencies.outputs.cache-hit != 'true'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          OMPI_CC: ${{ matrix.cc }}
          OMPI_CXX: ${{ matrix.cxx }}
        run: >-
          ./scripts/install_dependencies.sh
          --science-only
          --variant debug
          --jobs 2

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=OFF
          -DMPIEXEC_PREFLAGS=--oversubscribe

      - name: Build
        run: cmake --build build/ci --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build/ci --parallel 1 --output-on-failure

  coverage:
    name: Coverage
    needs: tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            libopenmpi-dev \
            ninja-build

      - name: Restore scientific dependencies
        id: scientific-dependencies
        uses: actions/cache@v5
        with:
          path: |
            .dependencies/downloads
            .dependencies/install
          key: scientific-dependencies-${{ runner.os }}-${{ runner.arch }}-Debug-GCC-${{ hashFiles('scripts/install_dependencies.sh') }}

      - name: Build scientific dependencies
        if: steps.scientific-dependencies.outputs.cache-hit != 'true'
        env:
          CC: gcc
          CXX: g++
          OMPI_CC: gcc
          OMPI_CXX: g++
        run: >-
          ./scripts/install_dependencies.sh
          --science-only
          --variant debug
          --jobs 2

      - name: Configure coverage build
        env:
          CC: gcc
          CXX: g++
        run: >-
          cmake -S . -B build/coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=OFF
          -DENABLE_COVERAGE=ON
          -DMPIEXEC_PREFLAGS=--oversubscribe

      - name: Build
        run: cmake --build build/coverage --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build/coverage --parallel 1 --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate coverage report
        run: |
          python -m pip install gcovr==8.6
          printf 'Raw GCC coverage:\n'
          gcovr \
            --root . \
            --filter 'include/rift/' \
            --filter 'src/' \
            --print-summary \
            --json-summary-pretty \
            --output coverage-raw-summary.json \
            build/coverage

          printf 'Policy-adjusted GCC coverage:\n'
          gcovr \
            --root . \
            --filter 'include/rift/' \
            --filter 'src/' \
            --print-summary \
            --fail-under-line 100 \
            --fail-under-function 100 \
            --fail-under-branch 100 \
            --json-summary-pretty \
            --json-summary coverage-summary.json \
            --cobertura-pretty \
            --output coverage.xml \
            build/coverage
          python - <<'PY'
          import json
          import sys

          with open("coverage-summary.json") as report:
              summary = json.load(report)
          if summary["line_total"] == 0 or summary["function_total"] == 0:
              sys.exit("error: GCC coverage contains no first-party executable lines or functions")
          if summary["branch_total"] == 0:
              print("branches: not applicable (0 branches)")
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: true
