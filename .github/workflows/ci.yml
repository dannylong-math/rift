name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (${{ matrix.name }})
    # Full CI is intentionally paused while tests are run locally. Remove this
    # line to enable the dependency cache/build and compiler matrix below.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            curl \
            libopenmpi-dev \
            ninja-build

      - name: Restore scientific dependencies
        id: scientific-dependencies
        uses: actions/cache@v5
        with:
          path: |
            .dependencies/downloads
            .dependencies/install
          key: scientific-dependencies-${{ runner.os }}-${{ runner.arch }}-Debug-${{ matrix.name }}-${{ hashFiles('scripts/install_dependencies.sh') }}

      - name: Build scientific dependencies
        if: steps.scientific-dependencies.outputs.cache-hit != 'true'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          OMPI_CC: ${{ matrix.cc }}
          OMPI_CXX: ${{ matrix.cxx }}
        run: >-
          ./scripts/install_dependencies.sh
          --science-only
          --variant debug
          --jobs 2

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=OFF

      - name: Build
        run: cmake --build build/ci --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build/ci --output-on-failure

  coverage:
    name: Coverage
    # Full CI is intentionally paused while tests are run locally. Remove this
    # line together with the matching gate above to enable coverage reporting.
    if: ${{ false }}
    needs: tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            clang \
            cmake \
            curl \
            libopenmpi-dev \
            ninja-build

      - name: Restore scientific dependencies
        id: scientific-dependencies
        uses: actions/cache@v5
        with:
          path: |
            .dependencies/downloads
            .dependencies/install
          key: scientific-dependencies-${{ runner.os }}-${{ runner.arch }}-Debug-Clang-${{ hashFiles('scripts/install_dependencies.sh') }}

      - name: Build scientific dependencies
        if: steps.scientific-dependencies.outputs.cache-hit != 'true'
        env:
          CC: clang
          CXX: clang++
          OMPI_CC: clang
          OMPI_CXX: clang++
        run: >-
          ./scripts/install_dependencies.sh
          --science-only
          --variant debug
          --jobs 2

      - name: Configure coverage build
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build/coverage -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DENABLE_SANITIZERS=OFF
          -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build/coverage --parallel 2

      - name: Run unit tests
        run: ctest --test-dir build/coverage --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate coverage report
        run: |
          python -m pip install gcovr==8.6
          llvm_cov="$(clang -print-prog-name=llvm-cov)"
          gcovr \
            --root "${GITHUB_WORKSPACE}" \
            --filter "${GITHUB_WORKSPACE}/include/" \
            --filter "${GITHUB_WORKSPACE}/src/" \
            --exclude "${GITHUB_WORKSPACE}/build/" \
            --gcov-executable "${llvm_cov} gcov" \
            --xml-pretty \
            --output coverage.xml \
            build/coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
